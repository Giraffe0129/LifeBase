version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 使用 PostgreSQL（推荐）
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-change_me}@db:5432/my_app
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:8000,https://your-domain.com
      - QWEATHER_API_KEY=${QWEATHER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: my_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
